[build-system]
requires = ["setuptools>=61", "Cython>=3.0", "numpy>=1.22"]
build-backend = "setuptools.build_meta"

[project]
name = "dfsph-flow"
version = "0.1.0"
description = "Fast 2D Divergence-Free SPH fluid solver with quadtree/octree neighborhood search (Cython)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lucas Pettit" }]
keywords = ["fluid", "simulation", "sph", "dfsph", "particle", "cython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://github.com/lucaspettit-dev/dfsph-flow"
Repository = "https://github.com/lucaspettit-dev/dfsph-flow"

[tool.setuptools.packages.find]
where = ["src"]
